databases:
  - name: db
    databaseName: sharing
    user: app
    postgresMajorVersion: "16"
    plan: free

services:
  - type: web
    name: backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"   # temporary; replace with your frontend URL later
      - key: PORT
        value: "8000"
