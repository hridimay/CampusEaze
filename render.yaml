databases:
  - name: db
    databaseName: sharing
    user: app
    postgresMajorVersion: "16"
    plan: free

services:
  - type: web
    name: backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false   # https://<frontend>.onrender.com, no trailing slash
      - key: PORT
        value: "8000"

  - type: web
    name: frontend
    runtime: static
    rootDir: ./frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false   # https://<backend>.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
